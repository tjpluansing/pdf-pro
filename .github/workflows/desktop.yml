name: Desktop app

# Builds Windows and macOS installers on every push to Primary, on manual runs,
# and on PRs that touch the desktop shell. Download them from the run's
# "Artifacts" section.
#
# Pushing a version tag (v1.2.3), or running this workflow on Primary with a
# version filled in, also publishes a release: the installers, the signed
# update files and latest.json, which the app checks to update itself. See
# docs/RELEASING.md.
#
# Pushes to Primary and manual runs sign the installers (and notarize the Mac
# ones) when the signing secrets are set; see docs/SIGNING.md. Without them,
# and on PRs, the installers are unsigned and show a warning on first launch.
#
# Each installer carries LibreOffice (MPL-2.0), which PDF Pro runs as a
# separate program to convert Word, Excel and PowerPoint files.
on:
  push:
    branches: [Primary]
    tags: ['v*']
  pull_request:
    # macOS runner minutes cost about 10 times Linux ones in a private repo, so
    # PRs build installers only when they change the desktop side.
    paths:
      - src-tauri/**
      - .github/workflows/desktop.yml
      - package-lock.json
  workflow_dispatch:
    inputs:
      release:
        description: 'Release this version (like 0.2.0; it must match the version files). Leave empty for a test build.'
        required: false
        default: ''

env:
  # The release being made: the pushed tag, or v<version> for a manual release.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release != '' && format('v{0}', inputs.release)) || '' }}
  LIBREOFFICE_VERSION: 26.2.7
  LIBREOFFICE_URL: https://download.documentfoundation.org/libreoffice/stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-apple-silicon
            target: aarch64-apple-darwin
            lo: aarch64/LibreOffice_${LIBREOFFICE_VERSION}_MacOS_aarch64.dmg
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin
            lo: x86_64/LibreOffice_${LIBREOFFICE_VERSION}_MacOS_x86-64.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Windows: Azure Artifact Signing (formerly Trusted Signing).
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      # macOS: Developer ID Application certificate and notarization. These are
      # renamed because `tauri build` acts on APPLE_* variables even when empty;
      # this workflow signs and notarizes the Mac app itself.
      MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MAC_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      MAC_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      MAC_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # In-app updates: the minisign key pair from `npx tauri signer generate`.
      # The app carries the public key and only installs files signed with
      # the private one. Without UPDATER_PUBKEY the app is built without an
      # updater.
      UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
      UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Where releases are published and where the app looks for updates. Set
      # this to a public repo (like tjpluansing/pdf-pro-releases) before this
      # repo goes private; see docs/RELEASING.md.
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version matches the release
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/Primary ]; then
            echo "::error::Releases are made from Primary; run the workflow on Primary"
            exit 1
          fi
          node scripts/release.mjs check "$RELEASE_TAG"

      # Sign only builds that people will install (not PRs), and only when this
      # platform's secrets are all set.
      - name: Decide whether to sign
        shell: bash
        run: |
          sign=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] \
                && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ] && sign=true
            else
              [ -n "$MAC_CERTIFICATE" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ] && [ -n "$MAC_NOTARY_APPLE_ID" ] \
                && [ -n "$MAC_NOTARY_PASSWORD" ] && [ -n "$MAC_NOTARY_TEAM_ID" ] && sign=true
            fi
          fi
          echo "SIGN=$sign" >> "$GITHUB_ENV"
          if [ "$sign" = true ]; then echo "Signing this build"; else echo "::notice::Unsigned build (PR, or signing secrets not set; see docs/SIGNING.md)"; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Cache the LibreOffice download
        uses: actions/cache@v4
        with:
          path: .libreoffice-download
          key: libreoffice-${{ env.LIBREOFFICE_VERSION }}-${{ matrix.name }}

      # Windows: unpack the MSI without installing it, then ship the folder as an app resource.
      - name: Get LibreOffice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .libreoffice-download | Out-Null
          $msi = Join-Path (Resolve-Path .libreoffice-download) 'libreoffice.msi'
          if (-not (Test-Path $msi)) {
            $url = "$env:LIBREOFFICE_URL/$env:LIBREOFFICE_VERSION/win/x86_64/LibreOffice_$($env:LIBREOFFICE_VERSION)_Win_x86-64.msi"
            Invoke-WebRequest -Uri $url -OutFile $msi -MaximumRetryCount 4 -RetryIntervalSec 15
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'libreoffice'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$unpacked`""
          if ($p.ExitCode -ne 0) { throw "msiexec failed with $($p.ExitCode)" }
          $soffice = Get-ChildItem $unpacked -Recurse -Filter soffice.exe | Select-Object -First 1
          if (-not $soffice) { throw 'soffice.exe not found in the MSI' }
          Move-Item $soffice.Directory.Parent.FullName src-tauri\libreoffice
          # Help pages and the copy of the installer are not needed to convert files.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src-tauri\libreoffice\help
          Get-ChildItem src-tauri\libreoffice -Filter *.msi | Remove-Item -Force
          "{0:N0} MB" -f ((Get-ChildItem src-tauri\libreoffice -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Get LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p .libreoffice-download
          dmg=.libreoffice-download/libreoffice.dmg
          [ -f "$dmg" ] || curl -fL --retry 4 -o "$dmg" "$LIBREOFFICE_URL/$LIBREOFFICE_VERSION/mac/${{ matrix.lo }}"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/lo" "$dmg"
          ditto "$RUNNER_TEMP/lo/LibreOffice.app" "$RUNNER_TEMP/LibreOffice.app"
          hdiutil detach "$RUNNER_TEMP/lo"
          du -sh "$RUNNER_TEMP/LibreOffice.app"

      # One build config for this run: LibreOffice as a resource (Windows), the
      # Windows signing command, and the updater's key and feed address.
      # Release builds also sign the update files, which needs the private key.
      - name: Write the build config
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const e = process.env;
            const c = e.RUNNER_OS === "Windows" ? JSON.parse(fs.readFileSync("src-tauri/tauri.libreoffice.conf.json", "utf8")) : {};
            if (e.RUNNER_OS === "Windows" && e.SIGN === "true") {
              c.bundle.windows = { signCommand: { cmd: "artifact-signing-cli", args: [
                "-e", e.AZURE_SIGNING_ENDPOINT, "-a", e.AZURE_SIGNING_ACCOUNT,
                "-c", e.AZURE_SIGNING_PROFILE, "-d", "PDF Pro", "%1"] } };
            }
            if (e.UPDATER_PUBKEY) {
              c.plugins = { updater: {
                pubkey: e.UPDATER_PUBKEY.trim(),
                endpoints: [`https://github.com/${e.RELEASES_REPO}/releases/latest/download/latest.json`],
                windows: { installMode: "passive" } } };
            }
            fs.writeFileSync("src-tauri/tauri.build.conf.json", JSON.stringify(c, null, 2));
          '
          cat src-tauri/tauri.build.conf.json
          update=false
          if [ -n "$RELEASE_TAG" ]; then
            if [ -n "$UPDATER_PUBKEY" ] && [ -n "$UPDATER_KEY" ]; then
              update=true
            else
              echo "::warning::UPDATER_PUBKEY or TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no update files and installed apps won't see it (docs/RELEASING.md)"
            fi
          fi
          echo "UPDATE_FILES=$update" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      - name: Install the Windows signing tool
        if: runner.os == 'Windows' && env.SIGN == 'true'
        run: cargo install artifact-signing-cli --locked

      # Tauri runs signCommand on PDF Pro's own .exe and on both installers.
      # LibreOffice's files are already signed by The Document Foundation.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.build.conf.json

      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem src-tauri/target/${{ matrix.target }}/release -Filter *.exe -Depth 0) +
                   @(Get-ChildItem -Recurse src-tauri/target/${{ matrix.target }}/release/bundle -Include *.msi, *.exe)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      # Put the Developer ID certificate in a throwaway keychain for this job.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.SIGN == 'true'
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "No Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          echo "Signing as $identity"
          echo "MAC_IDENTITY=$identity" >> "$GITHUB_ENV"

      # macOS: build the .app, put LibreOffice.app inside it with ditto (which
      # keeps its symlinks and signature), re-seal the outer app, then make the
      # disk image. A signed build seals the app with the Developer ID and the
      # hardened runtime, has Apple notarize it, and staples the ticket to the
      # app and then to the disk image, so Gatekeeper opens both without a
      # warning, even offline.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          notarize() {
            xcrun notarytool submit "$1" --apple-id "$MAC_NOTARY_APPLE_ID" --password "$MAC_NOTARY_PASSWORD" \
              --team-id "$MAC_NOTARY_TEAM_ID" --wait --timeout 60m --output-format json | tee "$RUNNER_TEMP/notary.json" || true
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --apple-id "$MAC_NOTARY_APPLE_ID" --password "$MAC_NOTARY_PASSWORD" --team-id "$MAC_NOTARY_TEAM_ID"
              echo "Apple did not accept $1 ($status)"; exit 1
            fi
          }
          npx tauri build --target ${{ matrix.target }} --bundles app --config src-tauri/tauri.build.conf.json
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          mkdir -p "$app/Contents/Resources/libreoffice"
          ditto "$RUNNER_TEMP/LibreOffice.app" "$app/Contents/Resources/libreoffice/LibreOffice.app"
          if [ "$SIGN" = true ]; then
            codesign --force --options runtime --timestamp --sign "$MAC_IDENTITY" "$app"
          else
            codesign --force --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGN" = true ]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
            notarize "$RUNNER_TEMP/app.zip"
            rm "$RUNNER_TEMP/app.zip"
            xcrun stapler staple "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi
          mkdir -p src-tauri/target/${{ matrix.target }}/release/bundle/dmg dmgroot
          ditto "$app" "dmgroot/$(basename "$app")"
          ln -s /Applications dmgroot/Applications
          # hdiutil on GitHub's Mac runners sometimes fails with "Resource busy"
          # while the system scans the new image; waiting and retrying clears it.
          dmg="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/PDF Pro_${{ matrix.name }}.dmg"
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "PDF Pro" -srcfolder dmgroot -ov -format UDZO "$dmg" && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ "$SIGN" = true ]; then
            codesign --force --timestamp --sign "$MAC_IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi

      # Convert a file with the LibreOffice that ships in the build, from where the app will find it.
      - name: Check the bundled LibreOffice converts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            soffice=src-tauri/target/${{ matrix.target }}/release/libreoffice/program/soffice.exe
          else
            soffice="$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)/Contents/Resources/libreoffice/LibreOffice.app/Contents/MacOS/soffice"
          fi
          printf 'PDF Pro conversion check PX-4821\n' > check.txt
          "$soffice" --headless --norestore --convert-to pdf --outdir check-out check.txt
          head -c 5 check-out/check.pdf | grep -q '%PDF'
          "$soffice" --headless --norestore --infilter=writer_pdf_import --convert-to 'docx:MS Word 2007 XML' --outdir check-out2 check-out/check.pdf
          head -c 2 check-out2/check.docx | grep -q PK
          echo "LibreOffice in the build converts both ways"

      # Give the files release names without spaces (GitHub would turn them
      # into dots). Release builds add the update files the app downloads (the
      # Windows installers themselves; on macOS, the finished app packed as
      # .tar.gz) with a signature next to each.
      - name: Collect the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          base="PDF-Pro_${APP_VERSION}_${{ matrix.name }}"
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$(ls $bundle/nsis/*.exe | head -1)" "out/PDF-Pro_${APP_VERSION}_windows-x64-setup.exe"
            cp "$(ls $bundle/msi/*.msi | head -1)" "out/PDF-Pro_${APP_VERSION}_windows-x64.msi"
            update_files=(out/*.exe out/*.msi)
          else
            cp "$(ls $bundle/dmg/*.dmg | head -1)" "out/$base.dmg"
            update_files=()
            if [ "$UPDATE_FILES" = true ]; then
              app=$(ls -d $bundle/macos/*.app)
              COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "out/$base.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
              update_files=("out/$base.app.tar.gz")
            fi
          fi
          if [ "$UPDATE_FILES" = true ]; then
            for f in "${update_files[@]}"; do
              npx tauri signer sign "$f"
              test -s "$f.sig"
            done
          fi
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: pdf-pro-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.SIGN == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Releases only (a version tag, or a manual run with a version): publish the
  # installers and update files as a GitHub release. The app reads latest.json from the newest release, so the release
  # stays a draft until every file is uploaded. Tags with a suffix
  # (v1.2.0-beta.1) become pre-releases, which the app ignores.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      # Publishing to another repo needs a token for it; this repo's own token
      # only reaches this repo.
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pdf-pro-*
          path: out
          merge-multiple: true
      - name: Publish the release
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASES_TOKEN" != true ]; then
            echo "::error::RELEASES_REPO is $RELEASES_REPO, so the RELEASES_TOKEN secret is needed to publish there (docs/RELEASING.md)"
            exit 1
          fi
          if ls out/*.sig >/dev/null 2>&1; then
            node scripts/release.mjs manifest "$version" out "https://github.com/$RELEASES_REPO/releases/download/$tag"
          else
            echo "::warning::No update files in this build, so installed apps won't be offered this version"
          fi
          node scripts/release.mjs notes "$version" > notes.md
          {
            echo
            echo '### Download'
            echo
            echo "- **Windows:** \`PDF-Pro_${version}_windows-x64-setup.exe\` (the \`.msi\` is for IT departments)"
            echo "- **Mac with Apple silicon (M1 and later):** \`PDF-Pro_${version}_macos-apple-silicon.dmg\`"
            echo "- **Mac with Intel:** \`PDF-Pro_${version}_macos-intel.dmg\`"
          } >> notes.md
          opts=()
          [[ "$version" == *-* ]] && opts+=(--prerelease)
          # In this repo, tag the built commit; a separate releases repo tags its own default branch.
          [ "$RELEASES_REPO" = "$GITHUB_REPOSITORY" ] && opts+=(--target "$GITHUB_SHA")
          if ! gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASES_REPO" --draft "${opts[@]}" \
              --title "PDF Pro $version" --notes-file notes.md
          fi
          # The .sig files are already inside latest.json.
          find out -type f ! -name '*.sig' -print0 | xargs -0 gh release upload "$tag" --repo "$RELEASES_REPO" --clobber
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false
          echo "Published https://github.com/$RELEASES_REPO/releases/tag/$tag"
          # A manual release also tags the released commit here, so the source
          # of every release can be found later.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
