name: Desktop app

# Builds unsigned Windows and macOS installers for every PR and every push to
# Primary. Download them from the run's "Artifacts" section.
#
# Each installer carries LibreOffice (MPL-2.0), which PDF Pro runs as a
# separate program to convert Word, Excel and PowerPoint files.
on:
  push:
    branches: [Primary]
  pull_request:
  workflow_dispatch:

env:
  LIBREOFFICE_VERSION: 26.2.7
  LIBREOFFICE_URL: https://download.documentfoundation.org/libreoffice/stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-apple-silicon
            target: aarch64-apple-darwin
            lo: aarch64/LibreOffice_${LIBREOFFICE_VERSION}_MacOS_aarch64.dmg
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin
            lo: x86_64/LibreOffice_${LIBREOFFICE_VERSION}_MacOS_x86-64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Cache the LibreOffice download
        uses: actions/cache@v4
        with:
          path: .libreoffice-download
          key: libreoffice-${{ env.LIBREOFFICE_VERSION }}-${{ matrix.name }}

      # Windows: unpack the MSI without installing it, then ship the folder as an app resource.
      - name: Get LibreOffice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .libreoffice-download | Out-Null
          $msi = Join-Path (Resolve-Path .libreoffice-download) 'libreoffice.msi'
          if (-not (Test-Path $msi)) {
            $url = "$env:LIBREOFFICE_URL/$env:LIBREOFFICE_VERSION/win/x86_64/LibreOffice_$($env:LIBREOFFICE_VERSION)_Win_x86-64.msi"
            Invoke-WebRequest -Uri $url -OutFile $msi -MaximumRetryCount 4 -RetryIntervalSec 15
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'libreoffice'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$unpacked`""
          if ($p.ExitCode -ne 0) { throw "msiexec failed with $($p.ExitCode)" }
          $soffice = Get-ChildItem $unpacked -Recurse -Filter soffice.exe | Select-Object -First 1
          if (-not $soffice) { throw 'soffice.exe not found in the MSI' }
          Move-Item $soffice.Directory.Parent.FullName src-tauri\libreoffice
          # Help pages and the copy of the installer are not needed to convert files.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src-tauri\libreoffice\help
          Get-ChildItem src-tauri\libreoffice -Filter *.msi | Remove-Item -Force
          "{0:N0} MB" -f ((Get-ChildItem src-tauri\libreoffice -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Get LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p .libreoffice-download
          dmg=.libreoffice-download/libreoffice.dmg
          [ -f "$dmg" ] || curl -fL --retry 4 -o "$dmg" "$LIBREOFFICE_URL/$LIBREOFFICE_VERSION/mac/${{ matrix.lo }}"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/lo" "$dmg"
          ditto "$RUNNER_TEMP/lo/LibreOffice.app" "$RUNNER_TEMP/LibreOffice.app"
          hdiutil detach "$RUNNER_TEMP/lo"
          du -sh "$RUNNER_TEMP/LibreOffice.app"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.libreoffice.conf.json
        shell: bash

      # macOS: build the .app, put LibreOffice.app inside it with ditto (which
      # keeps its symlinks and signature), re-seal the outer app, then make the
      # disk image.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          npx tauri build --target ${{ matrix.target }} --bundles app
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          mkdir -p "$app/Contents/Resources/libreoffice"
          ditto "$RUNNER_TEMP/LibreOffice.app" "$app/Contents/Resources/libreoffice/LibreOffice.app"
          codesign --force --sign - "$app"
          mkdir -p src-tauri/target/${{ matrix.target }}/release/bundle/dmg dmgroot
          ditto "$app" "dmgroot/$(basename "$app")"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "PDF Pro" -srcfolder dmgroot -ov -format UDZO \
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/PDF Pro_${{ matrix.name }}.dmg"

      # Convert a file with the LibreOffice that ships in the build, from where the app will find it.
      - name: Check the bundled LibreOffice converts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            soffice=src-tauri/target/${{ matrix.target }}/release/libreoffice/program/soffice.exe
          else
            soffice="$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)/Contents/Resources/libreoffice/LibreOffice.app/Contents/MacOS/soffice"
          fi
          printf 'PDF Pro conversion check PX-4821\n' > check.txt
          "$soffice" --headless --norestore --convert-to pdf --outdir check-out check.txt
          head -c 5 check-out/check.pdf | grep -q '%PDF'
          "$soffice" --headless --norestore --infilter=writer_pdf_import --convert-to 'docx:MS Word 2007 XML' --outdir check-out2 check-out/check.pdf
          head -c 2 check-out2/check.docx | grep -q PK
          echo "LibreOffice in the build converts both ways"

      - uses: actions/upload-artifact@v5
        with:
          name: pdf-pro-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
